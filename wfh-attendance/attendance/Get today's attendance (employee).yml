info:
  name: Get today's attendance (employee)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/me/attendance-records/today"
  auth:
    type: bearer
    token: "{{employeeToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
